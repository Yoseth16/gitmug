  <!-- Premium Motion (FASE 1.5) -->
  <style id="premium-motion">
    @media (prefers-reduced-motion: no-preference) {
      .reveal-up { opacity: 0; transform: translateY(20px); transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
      .reveal-up.is-visible { opacity: 1; transform: translateY(0); }
      
      .reveal-fade { opacity: 0; transition: opacity 1.2s ease-out; }
      .reveal-fade.is-visible { opacity: 1; }
      
      .stagger-1 { transition-delay: 0.1s; }
      .stagger-2 { transition-delay: 0.2s; }
      .stagger-3 { transition-delay: 0.3s; }
      .stagger-4 { transition-delay: 0.4s; }

      .btn-premium { position: relative; overflow: hidden; z-index: 1; }
      .btn-premium::before {
        content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        transform: skewX(-20deg); z-index: -1; transition: 0s;
      }
      .btn-premium:hover::before { left: 200%; transition: 0.7s ease-in-out; }

      .hover-lift { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease; }
      .hover-lift:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); border-color: #4F7CFF; }
      
      .parallax-img { transition: transform 0.2s ease-out; transform: scale(1.05); }
      
      /* Subtle 3D viewer container parallax */
      .viewer-parallax { transition: transform 0.2s ease-out; }
    }
    
    #page-transition {
      position: fixed; inset: 0; background: #111315; z-index: 9999; 
      pointer-events: none; opacity: 0; transition: opacity 0.4s ease;
    }
    #page-transition.active { opacity: 1; pointer-events: all; }
  </style>

  <main class="pt-24 md:pt-32 pb-12 min-h-screen bg-brand-dark flex flex-col items-center justify-start px-4 md:px-8">

        <div>GITMUG // PRESENTATION</div>
        <div id="slide-counter" class="text-brand-light font-bold">01 / 10</div>
      </div>
      
      <!-- VIEWER -->
      <div id="viewer-container" class="relative w-full aspect-video bg-[#0A0B0C] border border-brand-gray/20 overflow-hidden group cursor-pointer shadow-2xl">
        <img id="slide-image" src="presentation/slide-01.webp" alt="Slide 01" class="absolute inset-0 w-full h-full object-contain transition-opacity duration-300 opacity-0" />
        
        <!-- Controls Overlay -->
        <div class="absolute inset-y-0 left-0 w-1/3 z-10" id="area-prev"></div>
        <div class="absolute inset-y-0 right-0 w-1/3 z-10" id="area-next"></div>

        <!-- Progress Bar -->
        <div class="absolute bottom-0 left-0 w-full h-[2px] bg-brand-gray/10 z-20">
          <div id="progress-bar" class="h-full bg-brand-blue transition-all duration-300" style="width: 10%"></div>
        </div>
      </div>
      
      <!-- CONTROLS -->
      <div class="w-full flex justify-between items-center mt-6 px-2">
        <button id="btn-prev" class="text-brand-gray hover:text-brand-light font-mono text-sm uppercase tracking-widest transition-colors flex items-center gap-2 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-blue disabled:opacity-50 disabled:cursor-not-allowed p-2">
          &larr; PREVIOUS
        </button>
        
        <button id="btn-fullscreen" class="text-brand-gray hover:text-brand-light transition-colors p-2 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-blue" aria-label="Fullscreen">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
          </svg>
        </button>

        <button id="btn-next" class="text-brand-gray hover:text-brand-light font-mono text-sm uppercase tracking-widest transition-colors flex items-center gap-2 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-blue disabled:opacity-50 disabled:cursor-not-allowed p-2">
          NEXT &rarr;
        </button>
      </div>

    </div>
  </main>

  <script>
    const TOTAL_SLIDES = 10;
    let currentSlide = 1;
    
    const slideImg = document.getElementById('slide-image');
    const counter = document.getElementById('slide-counter');
    const progress = document.getElementById('progress-bar');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    const viewer = document.getElementById('viewer-container');
    const areaPrev = document.getElementById('area-prev');
    const areaNext = document.getElementById('area-next');

    // Make sure first image is visible once loaded
    slideImg.onload = () => { slideImg.classList.remove('opacity-0'); };
    if (slideImg.complete) slideImg.classList.remove('opacity-0');

    function updateSlide(index) {
      if (index < 1 || index > TOTAL_SLIDES) return;
      
      // Fade out
      slideImg.classList.add('opacity-0');
      
      setTimeout(() => {
        currentSlide = index;
        const slideNumber = currentSlide.toString().padStart(2, '0');
        
        slideImg.src = `presentation/slide-${slideNumber}.webp`;
        slideImg.alt = `Slide ${slideNumber}`;
        counter.textContent = `${slideNumber} / ${TOTAL_SLIDES}`;
        progress.style.width = `${(currentSlide / TOTAL_SLIDES) * 100}%`;
        
        btnPrev.disabled = currentSlide === 1;
        btnNext.disabled = currentSlide === TOTAL_SLIDES;
        
        // Preload next
        if (currentSlide < TOTAL_SLIDES) {
          const nextImg = new Image();
          nextImg.src = `presentation/slide-${(currentSlide + 1).toString().padStart(2, '0')}.webp`;
        }
      }, 150); // Matches opacity duration visually
    }

    // Controls
    btnPrev.addEventListener('click', () => updateSlide(currentSlide - 1));
    btnNext.addEventListener('click', () => updateSlide(currentSlide + 1));
    areaPrev.addEventListener('click', (e) => { e.stopPropagation(); updateSlide(currentSlide - 1); });
    areaNext.addEventListener('click', (e) => { e.stopPropagation(); updateSlide(currentSlide + 1); });
    viewer.addEventListener('click', () => updateSlide(currentSlide + 1));

    // Fullscreen
    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        viewer.requestFullscreen().catch(err => console.log(err));
      } else {
        document.exitFullscreen();
      }
    });

    // Keyboard
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        updateSlide(currentSlide + 1);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        updateSlide(currentSlide - 1);
      } else if (e.key === 'Home') {
        e.preventDefault();
        updateSlide(1);
      } else if (e.key === 'End') {
        e.preventDefault();
        updateSlide(TOTAL_SLIDES);
      }
    });

    // Initial state
    btnPrev.disabled = true;
  </script>

  <script>
    // Menú móvil (reutilizado)
    const menuToggle = document.getElementById('menu-toggle');
    const mobileMenu = document.getElementById('mobile-menu');
    function toggleMenu() {
      const isExpanded = menuToggle.getAttribute('aria-expanded') === 'true';
      menuToggle.setAttribute('aria-expanded', !isExpanded);
      mobileMenu.classList.toggle('hidden');
      mobileMenu.classList.toggle('flex');
      document.body.style.overflow = !isExpanded ? 'hidden' : '';
    }
    menuToggle.addEventListener('click', toggleMenu);
    mobileMenu.addEventListener('click', (e) => {
      if (e.target.tagName === 'A') toggleMenu();
    });

    </script>

  <!-- Premium Interactions (FASE 1.5) -->
  <script id="premium-interaction">
    document.addEventListener("DOMContentLoaded", () => {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
      
      document.querySelectorAll('.reveal-up, .reveal-fade').forEach(el => observer.observe(el));

      document.querySelectorAll('.btn-premium').forEach(btn => {
        const originalText = btn.innerText;
        btn.addEventListener('mouseenter', () => {
          if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            if(originalText.toUpperCase().includes('COMPRAR') || originalText.toUpperCase().includes('RESERVAR')) {
              btn.innerText = 'INITIALIZING ORDER...';
            } else if (originalText.toUpperCase().includes('CÓMO FUNCIONA') || originalText.toUpperCase().includes('VER GITMUG')) {
              btn.innerText = 'OPENING SYSTEM...';
            }
          }
        });
        btn.addEventListener('mouseleave', () => {
          btn.innerText = originalText;
        });
      });

      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        window.addEventListener('scroll', () => {
          const scrolled = window.scrollY;
          document.querySelectorAll('.parallax-img').forEach(img => {
            const limit = img.parentElement.offsetTop;
            if (scrolled > limit - window.innerHeight) {
              img.style.transform = `scale(1.05) translateY(${(scrolled - limit) * 0.05}px)`;
            }
          });
        }, { passive: true });
      }
      
      document.querySelectorAll('a[href]').forEach(a => {
        if(a.hostname === window.location.hostname && !a.hash && a.target !== "_blank") {
          a.addEventListener('click', e => {
            e.preventDefault();
            const target = a.href;
            const overlay = document.getElementById('page-transition');
            if (overlay) {
              overlay.classList.add('active');
              setTimeout(() => { window.location.href = target; }, 400);
            } else {
              window.location.href = target;
            }
          });
        }
      });
    });
  </script>
